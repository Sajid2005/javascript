<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Life Assistant</title>
</head>

<body>

    <script>
        // 1. Fitness Suggestion System
        let Age = Number(prompt("Enter your age in years: "));
        let Weight = Number(prompt("Enter your weight in KG: "));

        let minWeight, maxWeight;

        console.log(`Entered Age: ${Age}`);
        console.log(`Entered Weight: ${Weight}`);

        if (Age <= 0 || Age > 108) {
            alert(`Invalid Age: ${Age}`);
            console.log("Invalid age value entered.");
        }
        else if (Weight <= 0 || Weight > 185) {
            alert(`Invalid Weight: ${Weight}`);
            console.log("Invalid weight value entered.");
        }
        else {
            if (Age >= 0 && Age <= 12) {
                minWeight = 22;
                maxWeight = 31;
            }
            else if (Age <= 22) {
                minWeight = 43;
                maxWeight = 53;
            }
            else if (Age <= 33) {
                minWeight = 55;
                maxWeight = 62;
            }
            else if (Age <= 44) {
                minWeight = 58;
                maxWeight = 75;
            }
            else if (Age <= 55) {
                minWeight = 62;
                maxWeight = 79;
            }
            else if (Age <= 66) {
                minWeight = 65;
                maxWeight = 82;
            }
            else if (Age <= 77) {
                minWeight = 68;
                maxWeight = 83;
            }
            else {
                minWeight = 50;
                maxWeight = 72;
            }


            if (Weight < minWeight) {
                console.log("You are underweight for your age. Consider a healthy diet.");
            }
            else if (Weight > maxWeight) {
                console.log("You are overweight for your age. Consider exercising more.");
            }
            else {
                console.log("Your weight is in the ideal range. Keep it up.");
            }
        }

        // 2. Monthly Budget Planner
        let monthlyIncome = Number(prompt("Enter your monthly income: "));

        if (monthlyIncome < 0) {
            console.log(`Invalid income entered: ${monthlyIncome}`);
        }
        else {
            console.log(`Monthly Income: ${monthlyIncome}`);
            if (monthlyIncome < 11000) {
                console.log("Advice: Spend cautiously and save more.");
            }
            else if (monthlyIncome < 33000) {
                alert("Balanced budget.");
                console.log("Advice: Balanced budget.");
            }
            else {
                alert("You can consider investing.");
                console.log("Advice: You can consider investing.");
            }
        }

        // 3. Mobile Data Usage Checker
        let monthlyData = Number(prompt("Enter your monthly data usage (in GB): "));

        if (monthlyData < 0) {
            console.log(`Invalid data usage: ${monthlyData} GB`);
        }
        else {
            if (monthlyData < 4) {
                console.log(`You used ${monthlyData} GB - Low usage.`);
            }
            else if (monthlyData <= 12) {
                console.log(`You used ${monthlyData} GB - Normal usage.`);
            }
            else {
                console.log(`You used ${monthlyData} GB - Heavy usage. Consider upgrading your plan.`);
            }
        }

        // 4. Password Change System
        let currentPassword = prompt("Enter your current password: ");
        let newPassword = prompt("Enter a new password: ");
        let confirmPassword = prompt("Confirm the new password: ");

        console.log(`Previous Password: ${currentPassword}`);

        if (currentPassword === newPassword) {
            console.log("New password matches the old password.");
        }
        else if (newPassword !== confirmPassword) {
            console.log("New password and confirmation do not match.");
        }
        else {
            currentPassword = newPassword;
            console.log(`Password changed successfully to: ${currentPassword}`);
        }
        
    </script>
</body>

</html>
